services:
  db:
    image: mysql:8.0
    container_name: cineja-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: cine_ja_db
      # Permite root a partir de qualquer host na rede Docker (servidor Node conecta pelo IP do container).
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - localhost

  server:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cineja-server
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: cine_ja_db
      DB_DIALECT: mysql
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

    command: npm run dev

    networks:
      - localhost

networks:
  localhost:
    driver: bridge

volumes:
  db_data:
  node_modules:
